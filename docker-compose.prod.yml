version: '3.8'

services:
  backend:
    # Use image from ECR (not build locally)
    image: ${ECR_REGISTRY}/fullstack-ts-dashboard/backend:latest
    container_name: backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://${EC2_HOST}:3000
    restart: always
    networks:
      - app-network

  frontend:
    image: ${ECR_REGISTRY}/fullstack-ts-dashboard/frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge